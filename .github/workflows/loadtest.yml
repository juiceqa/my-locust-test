name: Run Load Test

on:
  push:
    branches:
      - main

jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir beautifulsoup4 locust

      # Step 4: Run the load test with locust
      - name: Run Load Test
        run: |
          locust -f locust.py --headless --users 50 --spawn-rate 5 --host https://jsonplaceholder.typicode.com --run-time 2m --stop-timeout 60 --html locust_report.html

      # Step 5: Verify that the report was generated
      - name: Verify report existence
        run: |
          ls -lh
          test -f locust_report.html && echo "✅ Report exists" || (echo "❌ Report missing" && exit 1)

      # Step 6: Upload the customized report
      - name: Upload Locust Report
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: locust_report.html

      # Step 7: Add the html report as a comment to the commit message
      - name: Comment on commit with report link
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ✅ **Locust Load Test Completed**
            📄 [Download Locust Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            _Triggered by commit `${{ github.sha }}`_
